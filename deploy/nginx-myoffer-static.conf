# MyOffer：前端静态导出 + nginx 托管
#
# 前置：
#   1. frontend/next.config.ts 使用 output:'export'
#   2. cd frontend && npm run build  → 产物在 frontend/out/
#   3. cp -r frontend/out/* /srv/myoffer/out/
#
# 本机只有公网 IP、无域名无证书 → 只监听 80，不加 http2
# （浏览器不支持 h2c 明文 HTTP/2，开 http2 必须配 TLS；补证书后再按文件末尾注释切换）

limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=perip:10m;

# 隐藏 nginx 版本号（响应头 Server: nginx）
server_tokens off;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /srv/myoffer/out;
    index index.html;

    client_max_body_size 2m;
    client_body_timeout 30s;

    # 每 IP 最多 16 个并发连接，避免单个客户端占满连接。
    limit_conn perip 16;

    # ── 压缩 ────────────────────────────────────────────────────────
    # gzip 一定可用，作为基线。实测产物 gzip 后单页首屏约 195–210 KB。
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml font/woff2;

    # Brotli 比 gzip 再省 12–18%，但 Debian/Ubuntu 官方源默认**不含** brotli 模块。
    # 可用时执行 `apt install libnginx-mod-http-brotli-filter` 后取消下面注释；
    # 没有就保持注释，功能不受影响，只是多占约 15% 字节。
    # brotli on;
    # brotli_comp_level 5;
    # brotli_types text/css application/javascript application/json image/svg+xml;

    # ── Next 静态产物：内容 hash 命名，可永久缓存 ───────────────────
    # 这是本方案收益最大的一条：二次访问不再重下约 200 KB 首屏 JS。
    #
    # ⚠️ nginx 的 add_header 不跨层继承：location 内一旦出现 add_header，
    #    server 级的安全头就不再生效。所以这里必须把安全头重复一遍。
    location /_next/static/ {
        # Cache-Control 已由 add_header 显式声明，再加 expires 会输出两条头
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        access_log off;
        try_files $uri =404;
    }

    location /assets/ {
        # Cache-Control 已由 add_header 显式声明，再加 expires 会输出两条头
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        access_log off;
    }

    # HTML 不缓存（保证发布后立刻生效），交给 ETag 协商
    # ⚠️ add_header 不跨层继承：本 location 内必须重复 server 级安全头，
    #    否则首页（最需要防点击劫持/嗅探的页面）丢失全部安全防护
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # ── ACME HTTP-01 验证目录（为将来签发 Let's Encrypt 证书预留）───────
    # 有域名后执行 deploy/enable-https.sh 即可，届时无需再改本文件。
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        access_log off;
    }

    # ── API 契约不对外暴露 ─────────────────────────────────────────
    # openapi.json 只在本地开发期用于生成前端类型；运行时站点不需要它，
    # 生产环境按最小暴露原则关闭（FastAPI 的 /docs UI 本就不经反代，天然 404）。
    location = /api/v1/openapi.json {
        return 404;
    }

    # ── API 反代到后端（同源，Cookie 照常工作）──────────────────────
    location /api/ {
        limit_req zone=api burst=20 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # ⚠️ 必须用 $remote_addr 覆盖而不是 $proxy_add_x_forwarded_for 追加：
        #    追加会把客户端自带的伪造 X-Forwarded-For 一起传给后端；
        #    后端（uvicorn --proxy-headers --forwarded-allow-ips 127.0.0.1）
        #    只信任本机 nginx 提供的该头 → request.client.host 即真实来源 IP
        #    且不可伪造，进程内限流（按 IP）才有效。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;

        # 注意：此处**故意不设 limit_rate**。
        # API 响应实测仅约 2.3 KB gzip，限速只会拖慢交互而无保护价值。
        # 真正的出口保护应放在 /_next/static/ 之外的大文件场景，本项目没有。
    }

    # 健康检查直通后端，便于外部监控
    location = /healthz {
        proxy_pass http://127.0.0.1:8000/healthz;
        proxy_set_header Host $host;
        access_log off;
    }

    # 数据库就绪检查有等待上限；监控存活仍使用 /healthz。
    location = /readyz {
        proxy_pass http://127.0.0.1:8000/readyz;
        proxy_read_timeout 10s;
        access_log off;
    }

    # ── 客户端路由回退（output:'export' 的静态产物无 index.html 目录结构）
    #    Next 用 trailingSlash:false → 生成 /offers.html 这类文件
    location / {
        try_files $uri $uri.html $uri/index.html /index.html;
    }

    # ── 安全头（HTTP 场景下的最小集）──────────────────────────────
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}

# ── 补上证书后（有了域名 + TLS）的切换清单 ───────────────────────────
# 1. 本文件：listen 80 → `listen 443 ssl http2;`，并加 ssl_certificate 两行
# 2. 加 80 端口 301 跳转 443 的 server 块
# 3. 打开 ssl_session_cache shared:SSL:10m; ssl_session_timeout 1h;（省 TLS 握手 RTT）
# 4. .env：COOKIE_SECURE=true
# 5. 打开上面的 brotli 段
# 6. 取消本行注释启用 HSTS：add_header Strict-Transport-Security "max-age=31536000" always;
