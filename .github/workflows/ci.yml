name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装发布测试工具
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rsync
      - name: 发布脚本语法检查
        run: bash -n deploy/server-sync.sh
      - name: 发布与故障回滚测试
        run: python -m unittest discover -s deploy/tests -v

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/ai-runtime/package-lock.json
      - name: 安装依赖
        run: pip install -e ".[dev]"
      - name: 安装 AI runtime 依赖
        working-directory: backend/ai-runtime
        run: npm ci --omit=dev
      - name: AI runtime 测试
        working-directory: backend/ai-runtime
        run: npm test
      - name: Lint（ruff）
        run: ruff check app tests
      - name: 单元/金标准测试（pytest）
        run: pytest -q
      - name: OpenAPI 契约漂移检查
        run: |
          python -m app.export_openapi > openapi.generated.json
          diff openapi.generated.json openapi.json
          diff openapi.json ../openapi.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖
        run: npm ci
      - name: Lint（eslint）
        run: npm run lint
      - name: 类型检查（tsc）
        run: npm run typecheck
      - name: 单元测试（vitest）
        run: npm run test
      - name: 生产构建（next build）
        run: npm run build
      - name: API 类型漂移检查
        run: |
          npm run gen:api
          git diff --exit-code lib/api/schema.d.ts

  e2e:
    # 生产形态 E2E：静态导出 + e2e/static-server.mjs 模拟 nginx（路由回退 +
    # /api 反代），与 deploy/nginx-myoffer-static.conf 同序。这是唯一能在提交
    # 阶段拦住前端回归的门禁——此前 CI 完全不跑 E2E，Makefile 里「发布前必跑」
    # 的 e2e-prod 红灯只有本地能看见。
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend, frontend]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # playwright 配置用 venv 里的 python -m uvicorn 起后端（venv 不在 PATH 上），
      # 这里显式建一个与本地同构的 venv。
      - name: 建后端 venv 并安装依赖
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"
      - name: 安装前端依赖
        run: npm ci
      - name: 安装 AI runtime 依赖
        working-directory: backend/ai-runtime
        run: npm ci --omit=dev
      - name: 安装 Playwright 浏览器
        run: npx playwright install --with-deps chromium
      - name: 生产构建（next build）
        run: npm run build
      - name: Playwright E2E（生产形态）
        run: npx playwright test -c playwright.prod.config.ts
      - name: 上传失败现场
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
