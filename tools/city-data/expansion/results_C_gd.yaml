# results_C_gd.yaml — 广东省社保锚点（广州）2026 年度基数核查
# 核查日期: 2026-10-25；口径: 2026 年度(2026-07~2027-06)，官方原文优先
# base 口径: 广东省企业职工基本养老保险缴费基数（全省统一），广州作为省锚承载
# hf 口径: 广州/深圳住房公积金缴存基数上下限（缴存年度 2026-07-01~2027-06-30）

广州:
  base_bounds: {min: 5521, max: 27603}   # 广东省 2026 养老基数（广州作为省锚承载）
  base_as_of: "2026-07"
  base_source: "https://guangdong.chinatax.gov.cn/gdsw/ssfggds/2026-10/08/content_b40dcb7bf605411fbb12e0f81281dc6b.shtml 广东税务局官网(转载广东省人社厅/省财政厅/国家税务总局广东省税务局粤人社发〔2026〕24号《关于公布2026年职工基本养老保险缴费基数上下限有关问题的通知》，2026-09-17印发、税务官网2026-10-08公开)：自2026-07-01起全省企业职工基本养老保险缴费基数上限调整为27603元、下限调整为5521元(全省统一、不再划分片区，即2025年度全口径社平9201元/月的300%/60%；2026-01-01起企业下限已先行统一为5510元、机关事业单位自2026-01-01起执行27603/5521)，旧基数差额视为正常缴费；旧值5500/27501(基准9167)上调约0.4%。21经济网(21jingji.com/article/20261014, 2026-10-14)、chrm.cn 等多源报道一致，官方gov.cn转述页可直接核验"
  hf_bounds: {min: 2680, max: 41697}
  hf_as_of: "2026-07"
  hf_source: "https://gjj.gz.gov.cn/gg/tzgg/content/post_10879601.html 广州住房公积金管理中心《关于2026年度住房公积金缴存调整有关问题的通知》(落款2026-06-30、官网2026-07-01发布)：2026年度(2026-07-01~2027-06-30)缴存基数上限=本市2025年职工月平均工资3倍即41697元(与2025年度持平)、下限不低于最低工资(当时现行标准2500元)，比例5%-12%。2026-09-01起随《广东省人民政府关于调整我省最低工资标准的通知》(粤府函〔2026〕188号)广州最低工资上调，缴存基数下限由2500元调整为2680元(https://www.gz.gov.cn/zt/shb/content/post_10990883.html 广州市政府门户2026-09-03，来源含广州公积金中心，单位及灵活就业人员须于2026-09-30前调整到位)，故现行下限为2680元。人社通(m12333.cn/policy/swdey.html)、观点网(guandian.cn, 2026-07-06)转载数字与官方一致"
深圳:
  hf_bounds: {min: 2520, max: 48471}
  hf_as_of: "2026-07"
  hf_source: "https://zjj.sz.gov.cn/csml/zfgjjtlzx/zmhd/cjwtjd_236/jcyw/content/post_12892783.html 深圳市住房公积金管理中心官方问答(2026-07-15)：2026年度(2026-07-01~2027-06-30)缴存基数上限=本市统计部门公布的2025年度全市在岗职工月平均工资的3倍、下限=2025年月最低工资标准(官方问答只给规则未列金额)；具体值48471/2520经腾讯新闻引深圳市住房和建设局2026-07-17官方互动答复核实(news.qq.com/rain/a/20260718A0B5RX00, 2026-07-18，专办员实测48471封顶、下限2520元)，与深圳本地宝(bsy.sz.bendibao.com/bsyDetail/636403.html, 2026-09-07更新，职工缴存基数范围2520~48471元)交叉印证，均与2025年度持平(2025年度在岗月平均工资16157元未变)。补充：2026-09-01起深圳月最低工资调至2700元(粤府函〔2026〕188号)，新参加工作及新调入职工缴存基数下限执行2700元、存量职工仍按2520元(https://zjj.sz.gov.cn/hdjl/ywzs/gjj/content/post_12977660.html 深圳公积金中心官方问答2026-09-11)"
  base_note: "深圳养老执行广东省统一基数（粤人社发〔2026〕24号自2026-07-01起全省统一上限27603/下限5521，见广州base_source），无独立 base_bounds"
