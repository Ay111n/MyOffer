# results_C_west.yaml — 城市数据扩充批次 C（12 城，公积金缴存基数专项）
# 采集日期: 2026-10-25；口径遵循任务口径（市级公积金，2026年度；执行期以各城通知为准）
# 口径说明: hf_as_of 取该标准实际执行的年-月；2026年度通知若明示"自2026年1月1日起执行"则填 2026-01，
#           属 2026-07-01 起的年度调整填 2026-07；查不到 2026 年度数据的沿用旧值并保持旧 as_of
# Sanity 复核: 每条均核对 月缴存额 与 基数×比例 的自洽性；株洲超出预设 sanity 区间（19000-27000），
#              原因为长株潭一体化参照长沙标准，有市公积金中心全文佐证，非口径误抓

衡阳:
  hf_bounds: {min: 1700, max: 21142}
  hf_as_of: "2025-01"
  hf_source: "衡阳市政府网 hengyang.gov.cn/hyszfgjj/xxgk/gzdt/xwdt/20241231/i3549607.html《关于调整衡阳市住房公积金缴存标准的通知》(衡金管委字〔2024〕5号，2024-12-31发布，自2025-01-01执行；全文见 zc.51shebao.com/detail/834182)：上限21142元(2023年衡阳城镇非私营在岗职工年平均工资84568元÷12×3)、下限1700元。2026年度未查到新调整通知(无 衡金管委字〔2025/2026〕缴存标准文号，衡阳官网政策栏目亦无)；衡阳本地宝 m.hy.bendibao.com/live/20750.shtm (2026-10-16) 仍标注 2026衡阳缴存基数下限1700/上限21142，故沿用旧值不变。注意：衡阳为自然年调整口径，21142 基于2023年社平，可能滞后"

