# 每个城市的决策引擎配置条目（v0.7 报告引擎）。
# 必需键在 rules_runtime/validate.py 的 REQUIRED_CITY_CONFIG_KEYS 登记，缺失即启动失败：
#   as_of        数据所属年月（YYYY-MM，取关键数据中最旧口径；启动时对超 14 个月的打过期警告）
#   tier_score   城市等级分（发展模块雷达轴）。基准=第一财经 2025 城市分级锚点
#                （一线 100/新一线 90/二线 80/三线 70），个别城市按榜单综合得分
#                连续微调、允许偏离锚点：一线末位广州 90、新一线头部重庆 92 为
#                刻意取值；v0.6 新增：无锡 82（二线头部，与济南同档）、洛阳/潍坊 78
#                （二线末位）；拉萨五线取 55。依据见 CITY_DATA_SOURCES.md 与 ../../../../tools/city-data/expansion/ 目录
#   social_insurance：五险一金费率（占缴费基数比例）；v0.6 新增城市按省继承锚点城市费率
#     personal：个人缴纳（医疗/养老/失业；公积金费率来自用户填报）
#     employer：单位缴纳（医疗/养老/失业/生育/工伤；生育已并入医保征收的省份按惯例值拆分单列）
#   base_bounds：社保缴费基数上下限（60%/300% 口径，省级统筹，同省城市一致）；
#   hf_bounds：公积金缴存基数上下限（市级口径，逐城核证）
#   housing：房价参考（全市二手成交均价 元/㎡）、典型面积、首付比例（2024-09 起全国下限 15%）、
#            贷款年利率（首套主流执行价）与年限
#   living：单人基本月生活成本（含房租，估算）——模块 5 物价系数锚点
#            （÷ 全国基准 3,000）；平均工资由 base_bounds.max ÷ 3 推导
