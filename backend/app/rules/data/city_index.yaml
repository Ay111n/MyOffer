meta:
  version: "0.7.1"
  status: >-
    reference data（城市 universe 唯一事实源；费率/房价/生活成本为参考值）。
    v0.6（2026-10）：universe 由 32 城扩至 121 城——一线+新一线+二线+三线
    全部 119 城（第一财经 2025 榜单口径）+ 省会兜底西宁/拉萨；海口 tier_score
    由 80 修正为 70（2025 榜单已将其划入三线）。新增 89 城数据为 2026-10 联网
    采集：公积金缴存基数逐城查证（2026 年度优先，未公布沿用 2025 并在 as_of
    体现），社保基数/费率按省继承锚点城市（省级统筹口径），房价为全市二手
    口径（挂牌价×0.92 修正），生活成本为租金锚点+经验推断（误差 ±15%）。
    逐城来源、推断与待复核标注见 ../../../../tools/city-data/expansion/ 目录（EXPANSION_GUIDE.md、
    results_A1/A2/B1/B2.yaml）；32 城存量口径仍见下文与 CITY_DATA_SOURCES.md。
    2026-10 全量联网核对：社保/公积金基数为最新缴费年度（优先 2026，个别城市
    未公布时沿用 2025 并在 as_of 体现）；房贷利率为首套主流执行价（LPR 5Y 3.5%，
    2026-09 报价）；生活水平模块由平均工资（社保基数上限÷3）与物价系数推导。
    v0.7（2026-10）：每城新增 tier（2025 榜单线级标签，/meta city_tiers 下发，
    供前端下拉分组）与 rent_deduction_monthly（住房租金专项附加扣除档值，
    国发〔2018〕41号三档：1500 直辖市/省会/计划单列；1100/800 按市辖区户籍
    人口是否超 100 万，85 城逐城联网核对见 rent_tier_R1/R2.yaml）。
    0.7.1（2026-10-05 房价复核）：深圳/杭州/广州/上海四城房价按 2026-09
    成交口径刷新（深圳 5.2万→6.0万，多源确认连续 6 个月环比上涨站稳 6 字头；
    杭州 2.6万→3.2万、广州 3.0万→3.4万、上海 5.1万→5.7万）——旧值疑似
    2024 年初口径，系统性低估购房压力、抬高买房模块分数。其余城市与
    2026-09 市场数据偏差在 ±10% 内未动；天津各源分歧大（1.29-1.8 万）
    维持旧值待贝壳成交口径专项复核。来源见 CITY_DATA_SOURCES.md。

