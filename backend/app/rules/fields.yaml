  options:
    - {value: fixed, label: 固定工时}
    - {value: flexible, label: 弹性}
    - {value: shift, label: 轮班}
    - {value: other, label: 其他（补充说明）}
  required_level: normal
  collection: initial_questions
  metrics: [workload, time_predictability]

weekly_work_hours:
  value_type: number
  min: 1
  max: 168                   # 物理上限（7×24）；超过即录入错误
  evidence_category: work_experience
  unit: h/week
  required_level: core
  collection: initial_questions
  metrics: [workload, time_occupation, effective_hourly]

weekend_pattern:
  value_type: enum
  evidence_category: work_experience
  options:
    - {value: double_off, label: 稳定双休}
