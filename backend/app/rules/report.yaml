# v5 三维比较规则；税费、城市和薪资档位沿用现有参考数据。
# 分数档内线性插值；可直接视作零的增益项允许单方有值。

meta: {report_version: "5"}

# 维度键与问卷保持一致。
decision_dimensions:
  economic: {label: 经济回报, modules: [salary, housing, living]}
  growth: {label: 职业成长, modules: [development]}
  experience: {label: 工作体验, modules: [health]}

three_dimension_scoring:
  economic:
    # 现金按绝对税后金额评分；购买力只记城市成本造成的档位变化，避免重复计入现金。
    usual_weights: {cash: 0.50, entry: 0.10, probation: 0.05, purchasing: 0.25, benefits: 0.10}
    buyer_weights: {cash: 0.45, entry: 0.10, probation: 0.05, purchasing: 0.20, benefits: 0.10, housing: 0.10}
    entry_bands: [{amount: 0, score: 0}, {amount: 10000, score: 25}, {amount: 30000, score: 50}, {amount: 60000, score: 75}, {amount: 100000, score: 100}]
    benefits_bands: [{ratio: 0, score: 20}, {ratio: 0.05, score: 45}, {ratio: 0.10, score: 70}, {ratio: 0.20, score: 90}]
  growth:
    category_weights: {opportunity: 0.35, responsibility: 0.35, skills: 0.15, cultivation: 0.10, options: 0.05}
    business_level: {core: 100, important: 80, normal: 60, support: 40, edge: 20}
    entry_scope: {marginal_tasks: 20, assist_tasks: 40, small_feature: 60, own_module: 80, own_feature_end2end: 100}
    mentorship: {formal: 100, assigned: 80, informal: 50, self_reliant: 20}
    feedback_cadence: {formal_regular: 100, informal_often: 80, occasional: 50, rare: 20}
    extended_maps:
      jd_match_level: {high_match: 100, basic_match: 80, partial_match: 55, notable_gap: 30, mismatch: 10}
      autonomy_level: {process: 20, occasional: 45, frequent: 75, high: 100}
      problem_complexity_level: {routine: 25, analytical: 50, complex: 75, open: 90, systemic: 100}
      skill_transferability: {high: 100, medium: 65, low: 25}
      internal_mobility: {available: 100, none: 0}
      portfolio_permission: {public: 100, anonymized: 60, none: 0}
      ai_tool_access: {supported: 100, allowed: 60, none: 0}
      user_impact_exposure: {direct: 100, indirect: 55, none: 0}
      goal_skill_fit: {high: 100, medium: 55, low: 15}
    zero_default: [internal_mobility, portfolio_permission, ai_tool_access, user_impact_exposure]
  experience:
    category_weights: {time: 0.45, rest: 0.15, boundary: 0.25, daily: 0.15}
    occupied_hours_bands: [{hours: 40, score: 95}, {hours: 45, score: 85}, {hours: 50, score: 75}, {hours: 55, score: 60}, {hours: 60, score: 45}, {hours: 70, score: 25}, {hours: 80, score: 5}]
    extended_maps:
      oncall_cadence: {none: 100, monthly_few: 75, weekly: 45, frequent: 15}
      after_hours_response: {none: 100, occasional: 75, weekly: 45, daily: 10}
      flex_schedule: {yes: 100, no: 0}
      meeting_load: {light: 100, moderate: 60, heavy: 20}
      manager_support: {high: 100, medium: 60, low: 20}
      team_speakup: {open: 100, mixed: 60, closed: 20}
      work_meaning: {high: 100, medium: 60, low: 20}
      side_project_policy: {allowed: 100, restricted: 50, prohibited: 0}
      workspace_comfort: {good: 100, average: 60, poor: 20}
      performance_pressure: {none: 100, low_ratio: 75, stack_rank: 35, high_pressure: 10}
    zero_default: [flex_schedule, side_project_policy]

# ── 个税（年度累计预扣法 + 年终奖单独计税）────────────────────────
# 2026-10 联网核对：税率表/速算数（2019 年版个税法）与起征点 5000 均现行有效；
# 年终奖单独计税依据财政部 税务总局公告 2023 年第 30 号，有效期至 2027-12-31，
# 到期前（2027 下半年）需复核是否再延续。
# 时效项集中登记在 policy_expiries（启动时由 validate.policy_expiry_warnings 检查，
# 避免在注释里埋日期、过期无人知晓）；每项：basis=文号依据、expires_on=失效日、
# review_after=进入提前复核窗口的起始日、impact=失效后不更新的后果。
policy_expiries:
  annual_bonus_separate_tax:
    basis: "财政部 税务总局公告 2023 年第 30 号"
    expires_on: "2027-12-31"
    review_after: "2027-06-30"
    impact: "年终奖单独计税优惠失效后须改为并入综合所得；未更新将高估到手现金"
tax:
  standard_deduction_monthly: 5000
  cumulative_brackets:        # 全年应纳税所得额累计 → 速算
    - {upper: 36000, rate: 0.03, quick: 0}
    - {upper: 144000, rate: 0.10, quick: 2520}
    - {upper: 300000, rate: 0.20, quick: 16920}
    - {upper: 420000, rate: 0.25, quick: 31920}
    - {upper: 660000, rate: 0.30, quick: 52920}
    - {upper: 960000, rate: 0.35, quick: 85920}
    - {upper: null, rate: 0.45, quick: 181920}
  bonus_monthly_brackets:     # 一次性收入单独计税：本笔全额 × 档税率 − 月度速算扣除（以本笔÷12 查档定档）
    - {upper: 3000, rate: 0.03, quick: 0}
    - {upper: 12000, rate: 0.10, quick: 210}
    - {upper: 25000, rate: 0.20, quick: 1410}
    - {upper: 35000, rate: 0.25, quick: 2660}
    - {upper: 55000, rate: 0.30, quick: 4410}
    - {upper: 80000, rate: 0.35, quick: 7160}
    - {upper: null, rate: 0.45, quick: 15160}

# 专项附加扣除 → 月扣除额（fields.yaml special_additional_deductions 的取值）。
# 2026-10 核对：2023 年 8 月国务院上调后的标准仍有效。住房租金按国发〔2018〕41号
# 分三档（直辖市/省会/计划单列市 1500；市辖区户籍人口超 100 万 1100；其余 800），
# v0.6 起 universe 已含普通地级市——每城档值见 city_index.yaml 的
# rent_deduction_monthly（引擎 report.py 消费）；此处 rent 仅作城市缺档时的兜底
# （取直辖市/省会档），启动校验保证 universe 内城市不依赖兜底。
special_deduction_monthly:
  children_education: 2000
  continuing_education: 400
  mortgage_interest: 1000
  rent: 1500
  elderly_support: 3000
  infant_care: 2000

# ── 福利折现（年福利补贴 = 补贴 + 餐食 + 宿舍，按月折算，不计税）─────
# 折现口径 = 员工省下的市场替代成本。2026-10 校准：外卖正餐客单约 30 元、
# 连锁快餐 15-25 元（2025），单餐折现 500-700 元/月区间成立，三档维持；
# 宿舍折现 1500 介于一线床位价（800-2000）与合租单间（一线 2500+）之间，维持。
welfare:
  meal_monthly: {three_meals: 1500, two_meals: 1000, one_meal: 500, no_meals: 0}
  dorm_monthly: 1500

# ── 买房攒首付（常规年度税后现金中的参考储蓄率；月供/房价走 city_index）──
# 2026-10 校准：全国居民储蓄率约 32%（国家统计局 2025 年度），青年「能存下一半
# 月薪」约占 39%（2025 存钱报告，样本偏一二线）；有明确攒首付目标会上浮，
# 取 0.45 作为「有目标的一二线毕业生」可持续口径（0.5 偏乐观上限）。
housing:
  down_payment_saving_rate: 0.45

# ── 购买力锚点（v5 购买力子分）──────────────────────────────────
# 全国单人基本生活成本基准 = 城市物价系数的锚点（全国平均 = 1.0，
# 一线 1.4+ / 二线 0.7-1.0）；城市月成本见 city_index 每城 living.baseline_cost_month。
living:
  national_baseline_cost_month: 3000  # ≈2025 城镇居民人均月消费支出量级

# ── 模块分档（0-100；min 为下限即进入该档）────────────────────────
salary_score_bands:          # v5 对固定年度税后现金插值（元/年）
  - {min: 600000, score: 95}
  - {min: 450000, score: 85}
  - {min: 350000, score: 75}
  - {min: 280000, score: 65}
  - {min: 220000, score: 55}
  - {min: 160000, score: 45}
  - {min: 120000, score: 35}
  - {min: 0, score: 25}
housing_payment_ratio_bands: # 按月供收入比（≤ max 进入该档；档内插值，超末档取末档分）
  - {max: 0.20, score: 90}
  - {max: 0.30, score: 80}
  - {max: 0.40, score: 70}
  - {max: 0.50, score: 55}
  - {max: 0.65, score: 40}
  - {max: 2.0, score: 25}
housing_tenure_adjust:       # 按攒首付年限对分数加减（插值；> 35 年取 -20）
  - {max_years: 5, score: 10}
  - {max_years: 8, score: 5}
  - {max_years: 15, score: 0}
  - {max_years: 25, score: -10}
  - {max_years: 35, score: -20}
purchasing_city_bands:     # v5 购买力子分：城市物价系数（城市月成本 ÷ 全国基准）→ 固定分
                            # 与收入彻底解耦：同城同分、跨城差固定、涨薪永不改变本子分。
                            # 1.0（全国平均）= 50 中性；曾用「两档位插值之差」随收入变化，
                            # 贵城市低薪段涨薪反降分（反单调），2026-10 改为纯城市口径。
  - {max: 0.50, score: 72}
  - {max: 0.70, score: 65}
  - {max: 0.90, score: 57}
  - {max: 1.00, score: 50}
  - {max: 1.20, score: 43}
  - {max: 1.50, score: 34}
  - {max: 2.00, score: 26}


# ── 模块等级（score ≥ min 进入该档；v5 引擎只消费 salary 与 housing）──
grades:
  salary:      [{min: 85, label: 很高}, {min: 70, label: 较高}, {min: 55, label: 中等}, {min: 0, label: 有空间}]
  housing:     [{min: 75, label: 轻松}, {min: 55, label: 尚可}, {min: 40, label: 有压力}, {min: 0, label: 需规划}]
